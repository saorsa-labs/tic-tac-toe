# tic-tac-toe (Stage 0): workspace pruned from upstream block/buzz —
# only `desktop` is imported (web/admin-web excluded, see FORK.md).
# The overrides/patchedDependencies blocks are preserved verbatim from
# upstream pnpm-workspace.yaml @ 7e34bee6.
packages:
  - "desktop"
allowBuilds:
  esbuild: true
overrides:
  # Force a single copy of the dismissable-layer. Radix packages otherwise
  # resolve different versions (react-menu pulled 1.1.11, react-dialog 1.1.15),
  # and each copy keeps its own module-level saved <body> pointer-events style —
  # so a modal menu opening a modal dialog left `pointer-events: none` stuck on
  # <body> when the dialog closed, freezing the app (#1482, reminder dialog).
  # Removable once every @radix-ui dep converges on one version naturally.
  "@radix-ui/react-dismissable-layer": 1.1.15
patchedDependencies:
  # isomorphic-git patch dropped: its consumer is an excluded workspace
  # package (pnpm ERR_PNPM_UNUSED_PATCH with desktop-only workspace).
  # The patch file is retained in patches/ for upstream parity.
  virtua@0.49.3: patches/virtua@0.49.3.patch
