[package]
name = "buzz-x0x-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "buzz-x0x-mcp"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

# Keep this crate directly testable until the packaging lane adds it to the
# repository workspace. Remove this table when adding `crates/buzz-x0x` to the
# root workspace members.
[workspace]

