name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-unit:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (pnpm 11.4.0 via packageManager)
        run: corepack enable
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        working-directory: desktop
        run: pnpm typecheck
      - name: Unit tests
        working-directory: desktop
        run: pnpm test

  smoke-mock:
    name: Playwright smoke (mock mode)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Install chromium
        working-directory: desktop
        run: pnpm exec playwright install --with-deps chromium
      - name: Build e2e bundle
        working-directory: desktop
        run: pnpm build:e2e
      - name: Smoke suite (mock bridge — no relay, no daemon)
        working-directory: desktop
        run: pnpm exec playwright test --project=smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: desktop/playwright-report/
          retention-days: 7
